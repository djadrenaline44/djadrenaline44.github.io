name: Deploy index.html

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download new index.html from release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download tmp-index-deploy --pattern 'dj-adrenaline.html' --dir /tmp/new
          mv /tmp/new/dj-adrenaline.html index.html
          ls -la index.html
      - name: Commit and push index.html
        run: |
          git config user.name "djadrenaline44"
          git config user.email "djadrenaline44@users.noreply.github.com"
          git add index.html
          git commit -m "Update index.html (DJ Adrenaline site refresh)"
          git push
